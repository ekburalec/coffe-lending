<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <meta name="robots" content="noindex">
    <title>Шаблон картинки превью 1200×630</title>
    <!--
        Исходник картинки для og:image. Не часть сайта: в dist не попадает.
        Рендер в assets/img/og-image.jpg — bin/build-og-image.php (см. docs/design/og-image/README.md).
        Стили встроены, чтобы шаблон был самодостаточным; цвета и шрифты — из assets/css/base/vars.css.
        В шаблоне проекта — нейтральная заглушка: замените тексты, цвета, шрифты и визуал.
        Свои шрифты подключаются @font-face с путём '../../../assets/fonts/…woff2'.
    -->
    <style>
        :root {
            --og-bg: #FFFFFF;
            --og-surface: #F4F5F7;
            --og-accent: #2F5BEA;
            --og-heading: #14161A;
            --og-text: #33363D;
            --og-line: #E1E3E8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            background: var(--og-bg);
        }

        .og {
            display: grid;
            grid-template-columns: 1fr 420px;
            width: 1200px;
            height: 630px;
            padding: 56px 56px 56px 72px;
            gap: 48px;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            color: var(--og-text);
        }

        .og__content {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-block: 8px;
        }

        .og__logo {
            color: var(--og-heading);
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .og__eyebrow {
            margin-bottom: 20px;
            color: var(--og-accent);
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .og__title {
            color: var(--og-heading);
            font-size: 72px;
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -0.02em;
        }

        .og__lead {
            max-width: 560px;
            margin-top: 22px;
            font-size: 25px;
            line-height: 1.35;
        }

        .og__facts {
            display: flex;
            gap: 12px;
            list-style: none;
        }

        .og__fact {
            padding: 12px 20px;
            border: 2px solid var(--og-line);
            border-radius: 999px;
            color: var(--og-heading);
            font-size: 20px;
            font-weight: 600;
            white-space: nowrap;
        }

        .og__fact--accent {
            border-color: var(--og-accent);
            background: var(--og-accent);
            color: #FFFFFF;
        }

        /* Место под визуал: фото товара, скриншот, знак. Картинку — <img> с путём '../../../assets/img/…' */
        .og__stage {
            display: grid;
            place-items: center;
            border-radius: 40px;
            background: var(--og-surface);
        }

        .og__mark {
            width: 200px;
            height: 200px;
            border: 36px solid var(--og-accent);
            border-radius: 48px;
        }
    </style>
</head>
<body>
    <div class="og">
        <div class="og__content">
            <p class="og__logo">Название проекта</p>
            <div>
                <p class="og__eyebrow">Надзаголовок</p>
                <h1 class="og__title">Оффер первого экрана</h1>
                <p class="og__lead">Подзаголовок: главный факт, который нужен в превью ссылки</p>
            </div>
            <ul class="og__facts">
                <li class="og__fact og__fact--accent">Факт 1</li>
                <li class="og__fact">Факт 2</li>
            </ul>
        </div>
        <div class="og__stage" aria-hidden="true">
            <div class="og__mark"></div>
        </div>
    </div>
</body>
</html>
